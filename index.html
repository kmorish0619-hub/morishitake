<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>森下家ものがたり</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#0b111b;
 font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Yu Gothic",YuGothic,Meiryo,system-ui,sans-serif;
 overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:stretch;justify-content:center}
button{font-family:inherit;border:none}
#stage{position:relative;width:100%;max-width:560px;height:100vh;height:100svh;
 display:flex;flex-direction:column;background:#0b111b;overflow:hidden;touch-action:none}

/* ===== 上：ステータスバー（ゲーム画面の外） ===== */
#topbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 9px 7px;
 padding-top:calc(6px + env(safe-area-inset-top));
 background:linear-gradient(180deg,#182234,#121a29);border-bottom:1px solid rgba(255,255,255,.08)}
#statwrap{flex:1;min-width:0;color:#fff}
#row1{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;margin-bottom:4px}
#row1 .lv{color:#131a26;background:#ffd54a;font-size:11px;font-weight:900;border-radius:6px;padding:1px 6px;flex:none}
#row1 .nm{color:#e6edf7;font-size:12px;font-weight:800;flex:none}
#zone{color:#ffe9a8;font-size:10.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
#fam{color:#bfe0ff;font-size:10.5px;font-weight:800;flex:none}
.brow{display:flex;align-items:center;gap:5px;margin-top:3px}
.lbl{font-size:9px;font-weight:900;color:#8fa2ba;width:18px;flex:none}
.bar{flex:1;min-width:0;height:9px;border-radius:99px;background:rgba(0,0,0,.5);overflow:hidden}
.bar.thin{height:5px}
.bar>i{display:block;height:100%;width:100%;border-radius:99px;transition:width .22s}
#hpf{background:linear-gradient(90deg,#7ee787,#33bd66)}
#exf{background:linear-gradient(90deg,#8ecbff,#4a9de0)}
#hpnum{font-size:10px;font-weight:800;color:#dbe6f3;flex:none;min-width:46px;text-align:right}
#miniWrap{flex:none;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.13);
 border-radius:8px;padding:3px;line-height:0}
#mini{width:60px;height:50px;image-rendering:pixelated;border-radius:4px}
#hudTog{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);
 color:#e6edf7;font-size:11px;font-weight:900}
#hudTog:active{transform:scale(.9)}
#topbar.min{padding-bottom:5px}
#topbar.min #miniWrap,#topbar.min .erow,#topbar.min #zone{display:none}
#topbar.min .brow{margin-top:2px}

/* ===== 中：ゲーム画面（なにも重ねない） ===== */
#view{position:relative;flex:1;min-height:0;overflow:hidden;background:#0a1018}
#cv{display:block;width:100%;height:100%}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;font-size:23px;font-weight:900;color:#fff;
 text-shadow:0 3px 0 rgba(0,0,0,.45);opacity:0;transition:opacity .45s;pointer-events:none}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(14,20,32,.9);
 color:#ffe9a8;font-size:13px;font-weight:800;padding:8px 16px;border-radius:99px;opacity:0;
 transition:opacity .3s;pointer-events:none;white-space:nowrap}

/* ===== 下：そうさエリア（ゲーム画面の外） ===== */
#bottom{flex:none;height:196px;padding-bottom:env(safe-area-inset-bottom);
 background:linear-gradient(180deg,#141d2c,#0e1522);border-top:1px solid rgba(255,255,255,.08);
 position:relative}
#ctrlbar{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
#joyzone{position:relative;width:138px;height:138px;flex:none;touch-action:none}
#joy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:124px;height:124px;
 border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18)}
#joyX{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60%;height:60%;
 border-radius:50%;border:1px dashed rgba(255,255,255,.13)}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;
 background:radial-gradient(circle at 40% 35%,#fff,#c8d3e2);transform:translate(-50%,-50%);
 box-shadow:0 3px 10px rgba(0,0,0,.45)}
#rightctl{display:flex;flex-direction:column;align-items:center;gap:10px}
.srow{display:flex;gap:8px}
.sbtn{width:56px;height:38px;border-radius:12px;background:rgba(255,255,255,.13);color:#e8eef8;
 font-size:12px;font-weight:800}
.sbtn:active{transform:translateY(2px)}
#abtn{width:92px;height:92px;border-radius:50%;background:#ffca3a;color:#5a3a12;
 font-size:16px;font-weight:900;box-shadow:0 5px 0 #d09317}
#abtn.off{background:#4a5262;color:#96a0b0;box-shadow:0 5px 0 #363d4a}
#abtn:active{transform:translateY(3px);box-shadow:0 2px 0 #d09317}

/* ===== 会話 ===== */
#dlg{position:absolute;inset:0;display:none;padding:8px 10px 10px;flex-direction:column;justify-content:flex-end}
#dlgName{align-self:flex-start;background:#3f6d4e;color:#fff;font-size:13px;font-weight:800;
 padding:4px 15px;border-radius:12px 12px 0 0;margin-left:8px}
#dlgBox{background:#fffaf0;border:3px solid #3f6d4e;border-radius:14px;padding:12px 14px 16px;
 font-size:16px;line-height:1.65;color:#382c20;flex:1;position:relative;overflow:hidden}
#dlgTip{position:absolute;right:12px;bottom:5px;font-size:12px;color:#3f6d4e;animation:bob .8s infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* ===== 戦闘 ===== */
#bt{position:absolute;inset:0;display:none;padding:8px 10px 10px;flex-direction:column}
#btMsg{background:rgba(0,0,0,.42);color:#fff;font-size:13.5px;font-weight:700;border-radius:11px;
 padding:8px 11px;margin-bottom:7px;line-height:1.45;flex:none;min-height:36px}
.panel{display:none;flex:1;min-height:0}
.grid2{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:7px}
.grid1{grid-template-columns:1fr;gap:5px;overflow-y:auto;align-content:start}
.cbtn{border-radius:12px;font-size:15px;font-weight:800;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.cbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.c1{background:#e05a5a}.c2{background:#3f9e5a}.c3{background:#4f86d0}.c4{background:#6f7684}
.lbtn{border-radius:10px;padding:9px 11px;font-size:13.5px;font-weight:700;color:#2b2118;
 background:#fff6e4;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbtn small{color:#8b7c66;font-size:10.5px;font-weight:700}
.lbtn:disabled{opacity:.42}
#pTiming{flex-direction:column;gap:6px}
#chargeBack{flex:none;height:38px;font-size:14px}
#stopBtn{width:100%;flex:1;border-radius:14px;font-size:23px;font-weight:900;
 color:#5a3a12;background:linear-gradient(180deg,#ffe066,#ffb42e);box-shadow:0 5px 0 #d08c17}
#stopBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #d08c17}

/* ===== 全画面オーバーレイ ===== */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
 padding:20px 16px;text-align:center;overflow-y:auto;z-index:5}
#title{background:radial-gradient(ellipse at 50% 30%,#8fd3f4,#4a7fb5 62%,#243f66)}
#title h1{font-size:29px;color:#fff;margin:0 0 6px;text-shadow:0 3px 0 rgba(0,0,0,.28)}
#title p{color:#eaf4ff;font-size:13px;margin:0 0 26px;line-height:1.8}
.big{border-radius:16px;padding:14px 32px;font-size:17px;font-weight:800;
 background:#ffca3a;color:#5a3a12;box-shadow:0 5px 0 #d09317}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #d09317}
#sel{background:#fdf6e6}
#sel h2{font-size:17px;margin:2px 0 10px;color:#3a2e21}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:400px}
.card{background:#fff;border:2px solid #e2d8c2;border-radius:13px;padding:6px 2px 7px;
 display:flex;flex-direction:column;align-items:center;gap:2px}
.card:active{transform:scale(.95)}
.card canvas{width:42px;height:46px}
.cn{font-size:13px;font-weight:800;color:#3a2e21}
.ck{font-size:10px;color:#8d8071}
#menu{background:rgba(10,14,22,.96);justify-content:flex-start;padding-top:18px}
#menu h3{color:#ffd54a;font-size:15px;margin:0 0 10px}
#mtabs{display:flex;gap:6px;margin-bottom:10px}
.tab{border-radius:99px;padding:7px 14px;font-size:13px;font-weight:800;
 background:rgba(255,255,255,.14);color:#cfd8e6}
.tab.on{background:#ffca3a;color:#5a3a12}
#mbody{width:100%;max-width:400px;color:#e8eef8;font-size:13px;line-height:1.7;text-align:left;
 flex:1;overflow-y:auto}
#mbody .row{display:flex;justify-content:space-between;align-items:center;gap:8px;
 background:rgba(255,255,255,.07);border-radius:10px;padding:9px 12px;margin-bottom:6px}
#mbody .row b{color:#ffe9a8}
#mapov{background:rgba(10,14,22,.97)}
#mapov canvas{width:100%;max-width:420px;image-rendering:pixelated;border-radius:10px;background:#0f1622}
#mapov p{color:#9fb0c6;font-size:12px;margin:10px 0 14px}
#end{background:linear-gradient(#ffe9b8,#ffcf86)}
#end h2{font-size:23px;margin:0 0 8px;color:#7a4a12}
#end p{font-size:14px;line-height:1.85;color:#6b4a24;margin:0 0 18px;max-width:340px;white-space:pre-line}

@media (max-height:720px){
 #bottom{height:172px}
 #joyzone{width:120px;height:120px}#joy{width:108px;height:108px}#knob{width:48px;height:48px}
 #abtn{width:80px;height:80px;font-size:15px}
 #btMsg{min-height:32px;font-size:12.5px;padding:7px 10px}
 .cbtn{font-size:14px}
}
</style>
</head>
<body>
<div id="stage">

 <div id="topbar">
  <div id="statwrap">
   <div id="row1"><span class="lv" id="lvTxt">Lv1</span><span class="nm" id="nmTxt">—</span>
    <span id="zone">もりしたけの にわ</span><span id="fam">なかま 0/13</span></div>
   <div class="brow"><span class="lbl">HP</span><div class="bar"><i id="hpf"></i></div>
    <span id="hpnum">48/48</span></div>
   <div class="brow erow"><span class="lbl">EX</span><div class="bar thin"><i id="exf"></i></div></div>
  </div>
  <div id="miniWrap"><canvas id="mini" width="76" height="64"></canvas></div>
  <button id="hudTog">▲</button>
 </div>

 <div id="view">
  <canvas id="cv"></canvas>
  <div id="banner"></div>
  <div id="toast"></div>
 </div>

 <div id="bottom">
  <div id="ctrlbar">
   <div id="joyzone"><div id="joy"><div id="joyX"></div></div><div id="knob"></div></div>
   <div id="rightctl">
    <div class="srow"><button class="sbtn" id="menuBtn">どうぐ</button>
     <button class="sbtn" id="mapBtn">マップ</button></div>
    <button id="abtn">しらべる</button>
   </div>
  </div>

  <div id="dlg">
   <div id="dlgName">ぱちり</div>
   <div id="dlgBox"><span id="dlgText"></span><span id="dlgTip">▼ タップ</span></div>
  </div>

  <div id="bt">
   <div id="btMsg"></div>
   <div class="panel grid2" id="pCmd">
    <button class="cbtn c1" data-c="atk">たたかう</button>
    <button class="cbtn c2" data-c="item">どうぐ</button>
    <button class="cbtn c3" data-c="skill">なかま</button>
    <button class="cbtn c4" data-c="run">にげる</button>
   </div>
   <div class="panel" id="pTiming">
    <button id="stopBtn">ストップ！</button>
    <button class="cbtn c4" id="chargeBack">もどる</button>
   </div>
   <div class="panel grid1" id="pList"></div>
  </div>
 </div>

 <div class="screen" id="title" style="display:flex">
  <h1>森下家ものがたり</h1>
  <p>〜 みんなの えがおを とりもどせ 〜</p>
  <button class="big" id="cont" style="display:none;margin-bottom:12px;background:#8be08b;color:#14401b;box-shadow:0 5px 0 #4d9b52">つづきから</button>
  <div id="saveInfo" style="display:none;color:#eaf4ff;font-size:12px;font-weight:800;margin-bottom:14px"></div>
  <button class="big" id="start">はじめる</button>
 </div>

 <div class="screen" id="sel">
  <h2>だれで あそぶ？</h2>
  <div id="grid"></div>
 </div>

 <div class="screen" id="menu">
  <h3>もちもの</h3>
  <div id="mtabs">
   <button class="tab on" data-t="item">どうぐ</button>
   <button class="tab" data-t="eq">そうび</button>
   <button class="tab" data-t="party">なかま</button>
   <button class="tab" data-t="set">せってい</button>
  </div>
  <div id="mbody"></div>
  <button class="big" id="menuClose" style="margin-top:12px">とじる</button>
 </div>

 <div class="screen" id="mapov">
  <canvas id="bigmap" width="380" height="320"></canvas>
  <p>しろい ところが あるいた ばしょ。◆たからばこ、●かぞく</p>
  <button class="big" id="mapClose">とじる</button>
 </div>

 <div class="screen" id="end">
  <h2>おめでとう！</h2>
  <p id="endTxt"></p>
  <button class="big" id="again">もういちど あそぶ</button>
 </div>
</div>

    var g1=null,g2=null,i;
    for(i=0;i<S.party.length;i++){if(!g1)g1=S.party[i];else if(!g2)g2=S.party[i]}
    msg=[{n:'ぱちり',col:'#7a6ca8',t:'これで かぞく ぜんいん、そろったよ！'},
     {n:g1?g1.n:'ぱちり',col:'#3f6d4e',t:'…おかの うえだな。あそこに、モヤモヤの ぬしが いる。'},
     {n:g2?g2.n:'ぱちり',col:'#3f6d4e',t:'こわくない。だって、'+FAM.length+'にん そろってるもの。'},
     {n:'ぱちり',col:'#7a6ca8',t:'さいごに これを わたしておく。わたしの レンズで つくった けんだよ。'},
     {n:'',col:'#c98a2a',t:'ぱちりの レンズけん を てにいれた！　こうげきりょく '+WEAPONS[6].a+'！'},
     {n:'ぱちり',col:'#7a6ca8',t:'さあ、いこう。みんなで。'}];
    if(S.P.wp<6)S.P.wp=6;updHUD()}
   else{
    msg=[{n:'ぱちり',col:'#7a6ca8',t:regName(rgid)+'の みんなが そろった！ きりが はれていくよ。'},

      (lead?lead.n+'たちが まってる！':'いそごう！')}]}
   say(msg,function(){toPlay();banner(regName(nx)+' が ひらけた！')});return}}
 toPlay()}
function bossWin(){
 S.boss.down=true;var hn=S.heroBase.n;
 say([{n:'モヤモヤ大王',col:'#5b4a7a',t:'…もう よい。わしの まけじゃ。'},
  {n:'モヤモヤ大王',col:'#5b4a7a',t:'わしはな…どの しゃしんにも、うつって おらんかった。'},

function ending(){S.mode='end';bottomPanel('ctrl');clearSave();
 $('endTxt').textContent='森下家 '+FAM.length+'にん、ぜんいん そろって しゃしんが とれました。\n'+
  'モヤモヤ大王は「モヤた」と なまえを もらって、いちばん はしっこに うつっています。\n\n'+

 $('end').style.display='flex'}


/* ================= セーブ ================= */
var SKEY='morishitake_save_v1';
function encSeen(){
 try{var by=[],i,k;
  for(i=0;i<seen.length;i+=8){var v=0;
   for(k=0;k<8;k++)if(seen[i+k])v|=(1<<k);
   by.push(v)}
  var str='';for(i=0;i<by.length;i++)str+=String.fromCharCode(by[i]);
  return btoa(str)}catch(e){return ''}}
function decSeen(b){
 try{var str=atob(b),i;
  for(i=0;i<seen.length;i++){var v=str.charCodeAt(i>>3)||0;seen[i]=(v>>(i&7))&1}}catch(e){}}
function saveGame(){
 if(!S.hero||!S.P)return;
 try{
  var d={v:1,hero:S.heroBase.id,regOf:S.regOf,P:S.P,unlocked:S.unlocked,
   hx:Math.round(S.hero.x),hy:Math.round(S.hero.y),
   party:S.party.map(function(c){return c.id}),
   npcs:S.npcs.map(function(n){return [n.c.id,Math.round(n.x),Math.round(n.y),n.saved?1:0,n.rg]}),
   chests:S.chests.map(function(c){return [Math.round(c.x),Math.round(c.y),c.k,c.v,c.c,c.open?1:0,c.rg]}),
   boss:[Math.round(S.boss.x),Math.round(S.boss.y),S.boss.down?1:0],
   seen:encSeen()};
  localStorage.setItem(SKEY,JSON.stringify(d));return true}catch(e){return false}}
function readSave(){try{var r=localStorage.getItem(SKEY);return r?JSON.parse(r):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SKEY)}catch(e){}}
function loadGame(){
 var d=readSave();if(!d||!d.hero)return false;
 genMap();
 var hb=famById(d.hero);if(!hb)return false;
 S.heroBase=hb;S.regOf=d.regOf||{};S.P=d.P;S.unlocked=d.unlocked;
 S.hero={x:d.hx,y:d.hy,fx:0,fy:1,walk:0,c:hb};
 S.trail=[];S.fx=[];S.kz=0;S.shake=0;
 S.party=[];
 (d.party||[]).forEach(function(id){var c=famById(id);if(c)S.party.push(c)});
 S.npcs=[];
 (d.npcs||[]).forEach(function(a){var c=famById(a[0]);
  if(c)S.npcs.push({c:c,x:a[1],y:a[2],saved:!!a[3],rg:a[4]})});
 S.chests=[];
 (d.chests||[]).forEach(function(a){
  S.chests.push({x:a[0],y:a[1],k:a[2],v:a[3],c:a[4],open:!!a[5],rg:a[6]})});
 S.boss={x:d.boss[0],y:d.boss[1],down:!!d.boss[2]};
 if(d.seen)decSeen(d.seen);
 S.total=FAM.length-1;
 S.cam.x=S.hero.x;S.cam.y=S.hero.y;
 S.mobs=[];spawnMobs();revealAround();updHUD();
 return true}

/* ================= メニュー ================= */
var mtab='item';
function openMenu(){if(S.mode!=='play')return;S.mode='menu';renderMenu();$('menu').style.display='flex'}
function closeMenu(){$('menu').style.display='none';S.mode='play';saveGame()}
function renderMenu(){
 var b=$('mbody'),h='',i;
 var tabs=document.querySelectorAll('.tab');
 for(i=0;i<tabs.length;i++)tabs[i].classList.toggle('on',tabs[i].getAttribute('data-t')===mtab);
 if(mtab==='item'){b.innerHTML='';var any=false;
  for(i=0;i<ITEMKEYS.length;i++){(function(k){
   var c=S.P.items[k]||0;if(c<=0)return;any=true;
   var el=document.createElement('div');el.className='row';
   el.innerHTML='<span><b>'+ITEMS[k].n+'</b> ×'+c+'<br><small style="color:#9fb0c6">'+ITEMS[k].d+'</small></span>';
   var bt=document.createElement('button');bt.className='tab';bt.textContent='つかう';
   bt.onclick=function(){var mh=maxHP(S.P.lv);
    if(S.P.hp>=mh){toast('HPは まんたん！');return}
    S.P.items[k]--;var hl=Math.min(ITEMS[k].hp,mh-S.P.hp);S.P.hp+=hl;updHUD();
    toast(ITEMS[k].n+'　HP +'+hl);renderMenu()};
   el.appendChild(bt);b.appendChild(el)})(ITEMKEYS[i])}
  if(!any)b.innerHTML='<div class="row">どうぐは からっぽ。たからばこを さがそう。</div>'}
 else if(mtab==='eq'){
  h='<div class="row"><span>ぶき</span><b>'+WEAPONS[S.P.wp].n+'（+'+WEAPONS[S.P.wp].a+'）</b></div>'+
   '<div class="row"><span>そうび</span><b>'+ARMORS[S.P.ar].n+'（+'+ARMORS[S.P.ar].v+'）</b></div>'+
   '<div class="row"><span>こうげきりょく</span><b>'+pATK()+'</b></div>'+
   '<div class="row"><span>ぼうぎょりょく</span><b>'+(baseDEF(S.P.lv)+ARMORS[S.P.ar].v)+'</b></div>'+
   '<div class="row"><span>つぎの レベルまで</span><b>'+Math.max(0,expNeed(S.P.lv)-S.P.exp)+'</b></div>';
  b.innerHTML=h;
}
 else if(mtab==='set'){renderSet(b)}
 else{h='';
  if(S.party.length===0)h='<div class="row">まだ なかまが いない。</div>';
  for(i=0;i<S.party.length;i++){var c=S.party[i];
   h+='<div class="row"><span><b>'+c.n+'</b>（'+c.k+'）<br><small style="color:#9fb0c6">'+
    c.sk.n+' — '+skDesc(c)+'</small></span></div>'}
  h+='<div class="row"><span>たすけた かぞく</span><b>'+S.party.length+' / '+S.total+'</b></div>';
  b.innerHTML=h}}
function renderSet(b){
 b.innerHTML='';
 var r1=document.createElement('div');r1.className='row';
 r1.innerHTML='<span>じどうセーブ<br><small style="color:#9fb0c6">'+
  'かいわや たたかいの あとに じどうで ほぞんされます</small></span>';
 var st=document.createElement('button');st.className='tab';st.textContent='いま ほぞん';
 st.onclick=function(){toast(saveGame()?'セーブしました':'セーブ できませんでした')};
 r1.appendChild(st);b.appendChild(r1);
 var r2=document.createElement('div');r2.className='row';
 r2.innerHTML='<span>さいしょから<br><small style="color:#9fb0c6">'+
  'セーブを けして キャラえらびに もどります</small></span>';
 var rs=document.createElement('button');rs.className='tab';rs.textContent='さいしょから';
 rs.style.background='#e8705f';rs.style.color='#fff';
 var armed=0;
 rs.onclick=function(){
  if(!armed){armed=1;rs.textContent='ほんとうに？ もういちど';
   setTimeout(function(){armed=0;rs.textContent='さいしょから'},4000);return}
  toSelect()};
 r2.appendChild(rs);b.appendChild(r2);
 var r3=document.createElement('div');r3.className='row';
 r3.innerHTML='<span>タイトルに もどる<br><small style="color:#9fb0c6">'+
  'セーブは のこります</small></span>';
 var tt=document.createElement('button');tt.className='tab';tt.textContent='タイトルへ';
 tt.onclick=function(){saveGame();$('menu').style.display='none';
  $('title').style.display='flex';S.mode='title';refreshTitle()};
 r3.appendChild(tt);b.appendChild(r3)}

/* ================= 入力 ================= */
var joyId=null,joyCX=0,joyCY=0;
var jz=$('joyzone');
function joyMove(e){
 var dx=e.clientX-joyCX,dy=e.clientY-joyCY,m=46,d=Math.sqrt(dx*dx+dy*dy);
 if(d>m){dx=dx/d*m;dy=dy/d*m}
 S.inputX=dx/m;S.inputY=dy/m;
 $('knob').style.transform='translate(calc(-50% + '+dx.toFixed(1)+'px),calc(-50% + '+dy.toFixed(1)+'px))'}
jz.addEventListener('pointerdown',function(e){
 if(S.mode!=='play')return;
 var r=$('joy').getBoundingClientRect();
 joyCX=r.left+r.width/2;joyCY=r.top+r.height/2;joyId=e.pointerId;
 if(jz.setPointerCapture)try{jz.setPointerCapture(e.pointerId)}catch(err){}
 joyMove(e);e.preventDefault()},{passive:false});
jz.addEventListener('pointermove',function(e){
 if(e.pointerId!==joyId)return;joyMove(e);e.preventDefault()},{passive:false});
function endJoy(e){if(e.pointerId!==joyId)return;joyId=null;S.inputX=0;S.inputY=0;resetKnob()}
jz.addEventListener('pointerup',endJoy);
jz.addEventListener('pointercancel',endJoy);
view.addEventListener('pointerdown',function(e){
 if(S.mode==='dlg'){dlgNext();return}
 if(S.mode==='battle'&&BT&&BT.phase==='aim'&&BT.mode!=='charge')aimDown(e)});
var keys={};
function readKeys(){if(joyId!==null)return;var x=0,y=0;
 if(keys.ArrowLeft||keys.a)x--;if(keys.ArrowRight||keys.d)x++;
 if(keys.ArrowUp||keys.w)y--;if(keys.ArrowDown||keys.s)y++;S.inputX=x;S.inputY=y}
window.addEventListener('keydown',function(e){keys[e.key]=1;
 if(e.key===' '||e.key==='Enter'){
  if(S.mode==='dlg')dlgNext();
  else if(S.mode==='play')interact();
  e.preventDefault()}
 readKeys()});
window.addEventListener('keyup',function(e){keys[e.key]=0;readKeys()});
$('abtn').addEventListener('click',function(e){e.stopPropagation();interact()});
$('dlg').addEventListener('pointerdown',function(e){e.stopPropagation();dlgNext()});
$('bottom').addEventListener('pointerdown',function(e){e.stopPropagation()});
var sb=$('stopBtn');
sb.addEventListener('pointerdown',function(e){e.stopPropagation();e.preventDefault();
 if(!BT||BT.phase!=='aim')return;
 if(BT.mode==='charge'&&sb.setPointerCapture)try{sb.setPointerCapture(e.pointerId)}catch(err){}
 aimDown(e)},{passive:false});
sb.addEventListener('pointerup',function(e){e.stopPropagation();e.preventDefault();aimUp(e)},{passive:false});
sb.addEventListener('pointercancel',function(e){aimUp(e)});
sb.addEventListener('click',function(e){e.stopPropagation()});
$('chargeBack').addEventListener('pointerdown',function(e){e.stopPropagation();e.preventDefault();
 if(BT&&BT.phase==='aim'){BT.charging=false;BT.cpos=0;BT.phase='cmd';
  setPanel('cmd');bmsg('どうする？')}},{passive:false});
$('chargeBack').addEventListener('click',function(e){e.stopPropagation()});
var cbs=document.querySelectorAll('.cbtn');
for(var q=0;q<cbs.length;q++)(function(b){b.addEventListener('click',function(e){
 e.stopPropagation();cmd(b.getAttribute('data-c'))})})(cbs[q]);
var hudMin=false;
$('hudTog').addEventListener('click',function(e){e.stopPropagation();
 hudMin=!hudMin;$('topbar').classList.toggle('min',hudMin);
 $('hudTog').textContent=hudMin?'▼':'▲';resize()});
$('menuBtn').addEventListener('click',function(e){e.stopPropagation();openMenu()});
$('menuClose').addEventListener('click',function(e){e.stopPropagation();closeMenu()});
$('mapBtn').addEventListener('click',function(e){e.stopPropagation();
 if(S.mode!=='play')return;S.mode='map';drawBigMap();$('mapov').style.display='flex'});
$('mapClose').addEventListener('click',function(e){e.stopPropagation();
 $('mapov').style.display='none';S.mode='play'});
var tbs=document.querySelectorAll('.tab[data-t]');
for(var q2=0;q2<tbs.length;q2++)(function(b){b.addEventListener('click',function(e){
 e.stopPropagation();mtab=b.getAttribute('data-t');renderMenu()})})(tbs[q2]);

/* ================= ループ ================= */
var last=0,NOWS=0;
function loop(ts){
 NOWS=ts/1000;
 var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 update(dt);
 if(S.mode==='battle'&&BT)drawBattle();
 else if(S.mode==='title'||S.mode==='sel'){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H)}
 else if(S.hero)drawWorld();
 if(S.hero&&(++miniT%5===0))drawMini();
 requestAnimationFrame(loop)}
function resize(){
 var w=view.clientWidth||360,h=view.clientHeight||400;
 DPR=Math.min(window.devicePixelRatio||1,2);W=w;H=h;
 cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);
 ZOOM=w/(11.5*TILE)}
window.addEventListener('resize',resize);

/* ================= 開始 ================= */
function buildSelect(){
 var g=$('grid');g.innerHTML='';
 for(var i=0;i<FAM.length;i++)(function(c){
  var b=document.createElement('button');b.className='card';
  var cc=document.createElement('canvas');cc.width=84;cc.height=92;
  var g2=cc.getContext('2d');g2.scale(2,2);drawChar(g2,21,45,c,0,1,0,false,.9);
  b.appendChild(cc);
  var n=document.createElement('div');n.className='cn';n.textContent=c.n;b.appendChild(n);
  var k=document.createElement('div');k.className='ck';k.textContent=c.k;b.appendChild(k);
  b.addEventListener('click',function(){begin(c.id)});g.appendChild(b)})(FAM[i])}
function begin(id){
 $('sel').style.display='none';newGame(id);
 var hn=S.heroBase.n;
 say([{n:'',col:'#7a6ca8',t:'きょうは 森下家の きねんしゃしんの ひ。'},
  {n:'',col:'#7a6ca8',t:'にわに '+FAM.length+'にん ならんで、はい、チーズ——'},
  {n:'',col:'#7a6ca8',t:'その しゅんかん、そらが まっしろな モヤモヤに つつまれた。'},
  {n:'ぱちり',col:'#7a6ca8',t:'…おきて。おきて、'+hn+'。'},
  {n:'ぱちり',col:'#7a6ca8',t:'わたしは ぱちり。この いえの カメラの せいれい。'},
  {n:'ぱちり',col:'#7a6ca8',t:'モヤモヤが、みんなを とおくへ つれて いってしまった。'},
  {n:'ぱちり',col:'#7a6ca8',t:'えがおを ひとつずつ とりもどせば、みんな かえってくる。'},
  {n:'ぱちり',col:'#7a6ca8',t:'あるきかた：がめんを ドラッグ。ちかづいて 「たすける」ボタン！'},
  {n:'ぱちり',col:'#7a6ca8',t:'たからばこには ぶきが はいってる。ひろえば ひろうほど つよくなるよ。'},
  {n:'ぱちり',col:'#7a6ca8',t:'たたかいは、きんいろの ところで ストップ！ うまく とめると だいダメージ！'},
  {n:'ぱちり',col:'#7a6ca8',t:'さあ '+hn+'。かぞくを たすけに いこう！'}],
  function(){toPlay();S.lastRg='home';$('zone').textContent='もりしたけの にわ';banner('もりしたけの にわ')})}
function refreshTitle(){
 var d=readSave();
 $('cont').style.display=d?'block':'none';
 $('start').textContent=d?'はじめから':'はじめる';
 if(d){var c=famById(d.hero);
  $('saveInfo').textContent=(c?c.n:'')+'　Lv'+d.P.lv+'　なかま '+(d.party?d.party.length:0)+'/'+(FAM.length-1);
  $('saveInfo').style.display='block'}
 else $('saveInfo').style.display='none'}
$('cont').addEventListener('click',function(){
 if(loadGame()){$('title').style.display='none';S.lastRg='';toPlay();
  banner('つづきから')}else{toast('セーブが よめなかった')}});
var startArm=0,startTm=null;
function toSelect(){
 clearSave();
 $('title').style.display='none';$('menu').style.display='none';$('end').style.display='none';
 $('mapov').style.display='none';$('sel').style.display='flex';S.mode='sel';
 startArm=0;$('start').textContent='はじめる'}
$('start').addEventListener('click',function(e){
 e.stopPropagation();
 var d=readSave();
 if(!d){toSelect();return}
 if(startArm){toSelect();return}
 startArm=1;$('start').textContent='セーブを けします。もういちど タップ';
 if(startTm)clearTimeout(startTm);
 startTm=setTimeout(function(){startArm=0;$('start').textContent='はじめから'},4000)});
$('again').addEventListener('click',function(){clearSave();$('end').style.display='none';
 $('sel').style.display='flex';S.mode='sel'});
resize();buildSelect();refreshTitle();
setTimeout(resize,60);window.addEventListener('orientationchange',function(){setTimeout(resize,250)});
requestAnimationFrame(function(t){last=t;requestAnimationFrame(loop)});
})();
</script>
